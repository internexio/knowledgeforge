# --------------------------------------------------------------------------
# Post-scrub verification (run in filtered clone)
# --------------------------------------------------------------------------
post_scrub_verify:
  # Verification: grep each pattern across all blobs (git grep) and all commit messages.
  # Exception: scripts/scrub-manifest.yaml itself is excluded from blob checks —
  # it necessarily documents the patterns it scrubs (the list entries and rationale
  # strings below). All other blobs and all commit messages must have zero hits.
  patterns_must_be_zero:
    - "Users/dp"            # matches /Users/dp — leading slash omitted to avoid self-match in this file
    - "Users/davidpedersen" # matches /Users/davidpedersen
    - "github@internexio.com"
    - "your-orchestra-host.example.com"
    - "client-project"
    - "client-project"
    - "[project]"      # added body-review pass (blobs + commit messages via --message-callback)
    - "[project]"
    - "[project]"         # added body-review pass
    - "[project]"  # added body-review pass
  patterns_allowed:
    - "internexio"   # Personal domain / GitHub org — keep
    - "semalytics.com"  # Public website — keep per body-review decision
  author_email_must_be: github@internexio.com
  removed_paths_must_not_exist:
    - scripts/happy-watchdog.sh
    - wiki/diagnostics/2026-05-19_cos-mcp-analyze-full-timeout-direct-curl-fallback.md
    - wiki/diagnostics/2026-05-20_cos-analyze-full-payload-ceiling-502.md
