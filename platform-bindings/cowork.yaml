platform: cowork
platform_version: "7.0"
description: >
  Cowork — plugin-based deployment. Subset of KF modes relevant to
  collaborative work context. No hooks, no filesystem. Plugin format
  constraints apply. Details TBD in Phase 8.

# --------------------------------------------------------------------------
# Platform capabilities (preliminary)
# --------------------------------------------------------------------------
capabilities:
  filesystem: false
  hooks: false
  multi_model: false
  sub_agents: false
  plugin_format: true    # Cowork-specific plugin manifest required

constraints:
  tbd: true    # Plugin format constraints not yet documented

# --------------------------------------------------------------------------
# Scope restriction — only modes relevant to Cowork context
# --------------------------------------------------------------------------
included_modes:
  - builder       # Spec writing
  - critic        # Review
  - strategist    # Decision support
  - synthesizer   # Pattern extraction
  - navigator     # Disambiguation

excluded_modes:
  - debugger      # Code debugging — not core Cowork use case
  - expert        # Deep technical analysis — not core Cowork use case
  - calibrator    # Setup/config — not applicable in Cowork context
  - coordinator   # Multi-agent orchestration — not applicable

# --------------------------------------------------------------------------
# Status
# --------------------------------------------------------------------------
status: deferred
deferred_to: Phase 8
notes: >
  Cowork plugin format constraints not yet documented. Placeholder binding
  created in Phase 6 for structural completeness. Full specification in
  Phase 8 (Web Agents variant) when Cowork integration is actively developed.
