target: codex
status: active
description: >
  OpenAI Codex CLI target. Produces a single AGENTS.md file that users
  copy to their project root. Codex reads AGENTS.md as natural language
  instructions, equivalent to how Claude Code reads CLAUDE.md.

capabilities:
  filesystem: true    # Codex CLI can read/write files
  hooks: false        # No hook runner equivalent
  multi_model: false
  sub_agents: false
  skills: false
  docs: false
  commands: false
  mcp: false

output_structure:
  agents_file: "AGENTS.md"

module_outputs:
  # M00 orchestrator is the single source — CC sections stripped
  source: "00_orchestrator.md"
  section: verbatim_stripped  # strip CC sections, output rest as-is
