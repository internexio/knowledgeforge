# --------------------------------------------------------------------------
# Special outputs — not derived from module sections
# --------------------------------------------------------------------------
special_outputs:

  # Coordinator: ENH-006 — no numbered module yet; compiled from enh spec
  coordinator:
    outputs:
      - type: skill
        path: ".claude/skills/kf/coordinator.md"
        source: "enhancements/enh-006-spec-drift-checkpoint.md"
        section: "CC Skill"
      - type: agent
        path: ".claude/agents/coordinator.md"
        source: "enhancements/enh-006-spec-drift-checkpoint.md"
        section: "CC Agent"

  # Hooks scripts — NOT compiled (unchanged from prior policy).
  # As of 2026-05-19, knowledgeforge-cc is the authoritative source for
  # .claude/hooks/ (synced from cw, see cc commit 1f5b748). cc/install.sh
  # deploys hooks into ~/.claude/hooks/ at install time. The historical
  # files in core/hooks/ are retained for reference only and may lag
  # behind cc. Compiler skips hook output entirely when this section is absent.
  #
  # Hook ENTRIES (declarations in settings.json) — compiled via cc_settings_fragment
  # below (added 7.1 — Phase 2 spec 5fd). Hook scripts and hook entries are
  # different artifacts: scripts live in .claude/hooks/ (cc-owned),
  # entries live in .claude/settings.json (cc-owned base) with the
  # KF-managed contribution split into .claude/settings.kf.json (compiler-owned)
  # and merged at install time.

  # Compile-time path-gated rules (added 7.1 — Phase 2 spec 5fd)
  # Per-module cc_rules: frontmatter entries are compiled into
  # .claude/rules/kf/*.md with paths: frontmatter. Orphan cleanup on each
  # compile removes pre-existing files not in the current manifest.
  # Subdirs of .claude/rules/kf/ are NOT recursed — kf-runtime/ is a
  # separate partition owned by the M21 accretion loop (M21:step_5b).
  cc_rules:
    output_dir: ".claude/rules/kf/"
    cleanup: "remove orphans not present in current manifest"
    section_naming_convention: "CC Rules — X"   # plural; matches CC_SECTION_MARKERS

  # Compiled settings.json fragment (added 7.1 — Phase 2 spec 5fd)
  # Per-module cc_hooks: frontmatter entries are aggregated across all modules
  # into a `kf_hooks` parallel key in .claude/settings.kf.json. cc/install.sh
  # shallow-merges into .claude/settings.json at install time via the sidecar
  # manifest at .claude/.kf-install-manifest.json (idempotent strip-then-add).
  # At v1, no module ships cc_hooks entries — emitter omits the file entirely.
  cc_settings_fragment:
    output_path: ".claude/settings.kf.json"
    install_merge: true
    install_manifest: ".claude/.kf-install-manifest.json"
    reserved_prefix: "_kf_"   # hand-authored entries MUST NOT use this prefix
    omit_if_empty: true       # at v1, hooks aggregate is empty; file is not emitted

  # Static agents — hand-maintained in knowledgeforge-cc, NOT in core.
  # core has never owned these files; the compiler does not read or write
  # them. cc/install.sh copies cc/.claude/agents/*.md → ~/.claude/agents/
  # at install time. Listed here purely as inventory; pathway is informational.
  static_agents:
    - ".claude/agents/adversarial-critic.md"
    - ".claude/agents/knowledge-librarian.md"

  # Commands — hand-maintained in knowledgeforge-cc, NOT in core.
  # Same ownership rule as static_agents above. cc/install.sh copies
  # cc/.claude/commands/*.md → ~/.claude/commands/ at install time.
  static_commands:
    - ".claude/commands/"
