  - version: 7.22.1
    date: 2026-07-06
    driver: knowledgeforge-core-oxp
    note: |
      Compiler fix (kf-compile.py:inject_toc) — TOC injection assumed line 1 was
      the <!-- Generated by kf-compile --> comment; since 5981a7e (frontmatter-first
      agents skip that comment), line 1 became the opening --- and the "agent
      branch" of inject_toc silently failed to fire. Fallback path then produced
      "---\n\n{toc}\n\n---\n{frontmatter+body}" — an empty first frontmatter block
      followed by the real frontmatter as body, which the Claude Code agent loader
      rejects. All 12 KF agents were invisible to `claude --agent <mode>` since
      2026-07-02 11:19, breaking [project] iteration_loop stage_1_critic.

      Fix: inject_toc now detects frontmatter-first content directly (startswith
      "---\n") and injects TOC after the closing ---, keeping --- on line 1.
      Header-first path (doc/skill) unchanged.

      In-file source trace restored via Option D: add_compile_header now
      injects the <!-- Generated by kf-compile ... --> comment AFTER the
      closing --- for frontmatter-first files (rather than on line 1, which
      would violate 5981a7e's loader constraint). inject_toc detects the
      trace and keeps it adjacent to frontmatter, TOC follows. Human ergonomics
      restored; manifest remains machine-authoritative.

