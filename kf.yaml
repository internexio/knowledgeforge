  - version: 7.27.0
    date: 2026-08-09
    driver: knowledgeforge-core-e49
    note: |
      Mid-chain premise invalidation — deterministic re-entry when a downstream
      chain step signals that a prior step's premise has been invalidated.

      M00 (Orchestrator) 7.22.0 -> 7.23.0: Added mid-chain re-entry rule to Mode
      Chaining Behavior (STATIC ZONE). Predicate: response.upstream_invalidation
      non-null AND severity IN [Sev2, Sev3] -> halt chain, re-enter at
      invalidated_step_id. Sev1 = log and continue. Repeated invalidation of the
      same step escalates to user. Circuit breaker exemption added (re-entry is
      correction, not failure). CP COMPILE-OUTWARD DELTA required.

      M03 (Coordination Patterns) 7.5.0 -> 7.6.0: Added response_schema to
      hc-strategist-to-builder with upstream_invalidation worked example. Three
      canonical ui-checks added to validation_checks. Registry count unchanged (13).

      M04 (Specification Templates) 7.3.0 -> 7.4.0: Added upstream_invalidation
      optional field to handoff_contract template (between response_schema and
      fallback_path). Added ui-check-1/2/3 to validation_checks block. Added
      KF 7.4 field summary table.

      M19 (Memory Architecture) 7.3.1 -> 7.4.0: Added 4th canonical
      re_routing_trigger: downstream_step_premise_invalidation (severity_threshold: 2).
      Format: "upstream_invalidation: invalidated_step_id=<id> evidence_ref=<ref>".

      New wiki entry: orchestration/2026-08-09_kf-governance-over-async-transport.md
      Maps AgentRadio (Coral AI Labs, arXiv 2026) six open problems to KF modules.

  - version: 7.26.0
    date: 2026-07-08
    driver: knowledgeforge-core-f8z
    note: |
      Integration opt-in/out system (kf-integrations.yaml).

      New: kf-integrations.yaml — canonical template declaring 7 integrations:
        mempalace, cos, asta, beads, gitnexus, gemini_routing, orchestra.
