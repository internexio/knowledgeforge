        Opt-out model (all enabled by default; set enabled: false to disable).
        Install: cp kf-integrations.yaml ~/.claude/kf-integrations.yaml

      New hook utility: ~/.claude/hooks/kf_integrations.py
        is_enabled(name) — fail-open: True if config missing or parse error
        get_config(name, key) — read per-integration config values
        resolve_python_path() — finds python3.11/python3 for mempalace hooks
        resolve_br_path() — finds br binary with config override support
        Stdlib-only parser (no PyYAML dependency)

      Hook updates (integration guards + hardcoded path fixes):
        mempalace-wiki-mine.py: guard (is_enabled("mempalace") → exit 0);
          PYTHON resolved via resolve_python_path() not hardcoded
        kf-route.py: guard (is_enabled("gemini_routing") → exit 0 in main())
        kf_wiki_search.py: guard (_MEMPALACE_INTEGRATION_ENABLED flag);
          skips tool_search import when mempalace disabled
        taskmaster-priority-awareness.py: guard (is_enabled("beads") → return 0)
        settings.json: br prime replaced with br-prime-safe.sh wrapper (×2)

      New: ~/.claude/hooks/br-prime-safe.sh — graceful br prime wrapper:
        Reads kf-integrations.yaml beads.enabled; skips if disabled.
        Resolves br via config override → PATH → ~/.local/bin/br.
        Exits 0 on any failure (FileNotFoundError, non-zero exit, not found).

      Module 08 (Synthesizer) 6.7.0 → 6.7.1: spec clarifications
        "COS MCP unavailable" = any mcp__cos-mcp__* tool error, not only disabled
        Detection signals (4) run regardless of COS MCP availability

