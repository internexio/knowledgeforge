status: active
phase: 0  # Repo setup and sync

variants:
  knowledgeforge-cp:
    role: Claude Projects variant
    status: current-source-of-truth
    repo: git@github.com:internexio/knowledgeforge-cp.git
    note: Will become compilation target once compiler is built (Phase 6)
  knowledgeforge-cc:
    role: Claude Code variant
    status: drifting
    repo: git@github.com:internexio/knowledgeforge-cc.git
  knowledgeforge-cw:
    role: Cowork variant
    status: drifting
    repo: git@github.com:internexio/knowledgeforge-cw.git
  knowledgeforge-web:
