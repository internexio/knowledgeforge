name: KnowledgeForge
version: 7.29.0
description: >
  Multi-platform, multi-model reasoning framework.
  Single source of truth for all KF variants.

status: active
phase: 6  # Compiler MVP

variants:
  knowledgeforge-cp:
    role: Claude Projects variant
    status: compiled
    repo: https://github.com/internexio/knowledgeforge-cp
    note: Compiled from core via kf-compile --target claude-projects
  knowledgeforge-cc:
    role: Claude Code variant
    status: compiled
    repo: https://github.com/internexio/knowledgeforge-cc
    note: Compiled from core via kf-compile --target claude-code
  knowledgeforge-cw:
    role: Cowork variant
    status: deprecated
    repo: https://github.com/internexio/knowledgeforge-cw
    note: |
      DEPRECATED 2026-06-15. Export path removed (platform-bindings/cowork.yaml
      deleted; kf-compile.py --target cowork removed from argparse choices).
      The shared/leaky -CP↔-CC strip behaviour traced back to a generic
      pre-target export path that originated when -CW was also a target —
      removing -CW lets the export filter be per-target and fail-closed.
      No new compiles will be produced for this variant; existing artifacts
      in the -CW repo are frozen at their last-shipped state.
  knowledgeforge-web:
    role: Web agents variant
    status: future
    note: Does not exist yet — Phase 8

modules:
  count: 26
  range: "00–25"
  source: knowledgeforge-cp (as of 2026-04-14)

