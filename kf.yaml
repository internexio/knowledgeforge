changelog:
  - version: 7.8.0
    date: 2026-06-12
    driver: knowledgeforge-core-8gp
    spec: docs/planning/2026-06-12_module-25-entity-path-glob-resolver-spec.md
    note: |
      M25 entity → path-glob resolver. Closes the <1% path_bound bottleneck
      from Phase 1 (y4b Section 4).

      Adds entity_paths to ERA output, populated by a GitNexus-primary +
      session-cached-grep-fallback resolver. M21 step_2c reads entity_paths
      into activation_profile.path_globs; step_3c handles the
      ERA-globs-on-global-scope case via downgrade (not rejection) to keep
      the resolver visible.

      Adversarial-critic pass surfaced 5 findings, all absorbed. Key fixes
      in revision: step_3c interaction protocol (downgrade vs reject),
      deterministic glob comparison function (literal-char prefix +
      lex tiebreak), repo-scoped grep cache key, resolver_source demoted
      to diagnostic metadata, M25 version read empirically (7.0.3 → 7.1.0).
    changes:
      - Module 25 (7.0.3 → 7.1.0) — entity_paths field, glob derivation rules, comparison function, resolver shape.
      - Module 21 (7.1.3 → 7.1.4) — step_2c entity_paths lookup, step_3c ERA-globs-on-global-scope downgrade rule, path_globs_meta sidecar field.
      - knowledgeforge-core-8gp closed (P3 → CLOSED).
  - version: 7.7.1
    date: 2026-06-12
    driver: knowledgeforge-core-3ym
    note: |
      M21 step_5_file path formula corrected. Was {wiki_root}/{domain}/{topic}.md
      (one file per topic) — actual wiki uses {wiki_root}/{domain}/{YYYY-MM-DD}_{slug}.md
      (one file per entry). Pre-existing M21 bug surfaced by e0x Critic
      finding [5]. Spec was the stale party; 218 wiki entries already followed
      the corrected formula. Spec-vs-reality alignment; no behavior change.
    changes:
      - Module 21 (7.1.2 → 7.1.3) — step_5_file path formula + slug derivation + collision suffixing rules.
      - knowledgeforge-core-3ym closed (P3 → CLOSED).
  - version: 7.7.0
    date: 2026-06-11
    driver: knowledgeforge-core-ev4
    note: |
      M00 — 4 always-on behavioral patches borrowed from Karpathy-inspired skills.

      Adds an "Always-On Behavioral Patches" section to M00's CC Rules
      (compiled to ~/.claude/rules/kf-meta.md). Four principles:
        1. Think Before Coding — state assumptions, surface interpretations, push back
        2. Simplicity First — minimum code, no speculative features
        3. Surgical Changes — touch only what's required
        4. Goal-Driven Execution — define success criteria, verify

      Rationale — KF's selective-activation philosophy leaves many turns
      mode-less. The 2026-06-10 session had 3 Critic-caught bugs that
      Karpathy principles would have prevented in the original Builder
      pass (Phase 1 version-bump optimism, Phase 2 non-idempotent merge,
      e0x speculative topic enumeration). Each Critic spawn costs ~100K
      tokens; the 300 always-loaded tokens pay for themselves on the
      first prevention.

      Patches Claude's weakness (over-engineering, scope creep, missing
      assumptions) — does not violate the KF meta-principle since these
      are weakness-patches, not strength-scaffolding.

      Source: multica-ai/andrej-karpathy-skills (CLAUDE.md).
    changes:
      - Module 00 (7.3.0 → 7.4.0) — Always-On Behavioral Patches section in CC Rules.
      - knowledgeforge-core-ev4 closed (P3 → CLOSED).
  - version: 7.6.0
    date: 2026-06-10
    driver: knowledgeforge-core-e0x
    spec: docs/planning/2026-06-10_module-23-vocabulary-drift-reconciliation-spec.md
    note: |
      Module 23 vocabulary drift reconciliation — Option C (hybrid expand
      + grandfather).

      Adds 5 new domains (methodologies, diagnostics, orchestration,
      migrations, compiler) covering 51% of wiki entries previously in
      directories absent from v6.5.x vocab. Topic lists are empirical
      baselines from on-disk frontmatter (55 topics observed), not
      speculative.

      Grandfathering policy: entries created before 2026-06-10 exempt
      from domain/topic field requirement. Creation timestamp resolves
      via created: → git first-commit → file mtime. Forgery resistance
      via M21 linter MEDIUM finding on ±1 day created vs git divergence.

      patterns/orchestration topic DEPRECATED (collision with new
      orchestration domain). Lazy migration on next touch.

      Extension event counting interpretation locked: one bead = one
      protocol invocation = one event. v6.x budget consumed 1/5.

      Phase 0 probe (empirical):
        - 218 wiki entries total
        - 111 (51%) in drift dirs
        - 95 (44%) lack domain/topic schema (grandfathered)
        - 55 unique topics observed across drift dirs

      Adversarial-critic pass surfaced 6 findings, all absorbed before
      gate. See revision history at top of spec.

      Follow-up beads filed (not blocking impl):
        - y64 (P3) — cc librarian agent update
        - 3ym (P3) — M21:527 file-layout reconciliation (pre-existing)
        - 96p (P4) — bulk migration of grandfathered entries
        - a05 (P4) — topic pruning + sparse domain expansion
        - 01q (P4) — comma-separated topic reconciliation
    changes:
      - Module 23 (6.5.2 → 6.6.0) — 5 new domains, ~55 new topics, Grandfathering section, patterns/orchestration deprecation.
      - Module 21 (7.1.1 → 7.1.2) — Gate 4a grandfather pre-check, linter schema-completeness rule, linter backdating-detection rule.
      - knowledgeforge-core-e0x closed (P3 → CLOSED).
  - version: 7.5.0
    date: 2026-06-10
    driver: knowledgeforge-core-261
    spec: docs/planning/2026-06-10_cc-rules-and-hook-emitter-spec.md
    note: |
      Phase 2 — cc rules emitter + settings.kf.json hook fragment emitter.

      Adds two new compile-time emitters to the claude-code target:
        - cc_rules: per-module YAML frontmatter cc_rules entries are
          compiled into .claude/rules/kf/*.md with `paths:` frontmatter.
          Orphan cleanup on each compile removes pre-existing files not
          in the current manifest.
        - cc_settings_fragment: per-module cc_hooks entries aggregate
          into a `kf_hooks` parallel key in .claude/settings.kf.json,
          which cc/install.sh shallow-merges into .claude/settings.json
          via the sidecar manifest at .claude/.kf-install-manifest.json.

      Ownership-rule resolution (Option B fragment-merge): cc keeps
      ownership of .claude/hooks/ scripts and the base settings.json.
      The compiler owns only settings.kf.json. Hook scripts and hook
      entries are different artifacts.

      Idempotency contract (subdir partition):
        .claude/rules/kf/         — compile-time partition (orphan-cleaned each compile)
        .claude/rules/kf-runtime/ — runtime partition (M21 accretion loop; step_5b)

      Deferred-activation at v1: no module ships cc_hooks entries at v1,
      so emit_settings_fragment OMITS the file entirely (does not emit `{}`).
      First production cc_hooks entries land after the linter violation
      counter ships (bead knowledgeforge-core-8zt).

      Test fixture: tests/fixtures/cc_hooks_smoke_module.md exercises the
      pipeline with one synthetic cc_hooks entry.

      M21 7.1.0 → 7.1.1 (added step_5b_emit_path_gated_rule for runtime emit).
      Platform binding claude-code.yaml 7.0 → 7.1.
    changes:
      - compiler/kf-compile.py — added parse_module_metadata, emit_cc_rules_for_module, cleanup_orphan_rules, collect_cc_hooks_entry, emit_settings_fragment. Wired into compile_claude_code.
      - platform-bindings/claude-code.yaml — bumped to 7.1; added cc_rules and cc_settings_fragment under special_outputs; documented ownership split for settings.json.
      - modules/21_knowledge_accretion.md — bumped 7.1.0 → 7.1.1; added step_5b_emit_path_gated_rule to claude_code_runtime.filing.
      - tests/fixtures/cc_hooks_smoke_module.md — synthetic test fixture for emitter validation.
      - knowledgeforge-core-261 closed (P2 → CLOSED).
  - version: 7.4.0
    date: 2026-06-10
    driver: knowledgeforge-core-poz
    spec: docs/planning/2026-06-10_module-21-activation-profile-spec.md
    note: |
      Module 21 Phase 1 — activation_profile on accretion candidate metadata.

      Adds activation_profile block (trigger, decidability, miss_cost, native,
      path_globs) to the accretion_candidate schema. Adds native:true as a third
      gate clause alongside novelty + reuse value. v1 ships native in
      deferred-activation mode (default false, no auto-emission) so the gate
      envelope is unchanged for existing modes.

      Adds step_2c_activation_profile (assignment) and step_3c_profile_cross_validate
      (scope cross-cut) to the claude_code_runtime filing protocol. Profile is
      substrate-agnostic; downstream dispatchers consume it (Module 22, future
      cc rules/hook emitters per Phase 2 spec 5fd).

      Backwards-compatibility: existing modes do not auto-emit native:true; no
      behavioral change to v7.3.x gate yield.

      Phase 2 (cc rules + hook emitters, spec at docs/planning/2026-06-10_cc-rules-and-hook-emitter-spec.md)
      is queued; impl bead is knowledgeforge-core-261.
    changes:
      - Module 21 (7.0.6 → 7.1.0) — activation_profile schema added to candidate metadata; three-condition gate; step_2c + step_3c added to filing protocol; CC Doc patches in parallel.
      - knowledgeforge-core-poz closed (P2 → CLOSED).
  - version: 7.3.1
    date: 2026-05-25
    driver: knowledgeforge-core-rk4
    note: |
      Module 22 Phase 1 hook implementation landed + empirical threshold recalibration.

      During rk4 implementation, empirical probing against the live MemPalace collection
      (2415 drawers) revealed that exact-content queries cap at ~0.889 cosine similarity
      due to MemPalace's chunked drawer storage. The spec'd threshold of 0.9 was
      empirically unreachable — Phase 1 at 0.9 would have shipped as a no-op.

      Builder calibration call: threshold recalibrated to 0.85 (below 0.889 with margin;
      far above novel-content noise ceiling at ~-0.04). M22 v7.3.0 → v7.3.1. Hook code
      shipped at the calibrated value. End-to-end test confirmed the dup-check fires on
      a known wiki entry.

      The calibration finding was filed to wiki/diagnostics/ as a reusable pattern
      (Threshold-vs-empirical calibration gap in similarity-based systems).
    changes:
      - Module 22 (7.3.1) — threshold recalibrated 0.9 → 0.85 across spec text + code blocks + warning messages + CC Doc. Implementation Status table flipped — hook row now ✅ Landed with the calibrated threshold. Success Criteria section updated to reflect live state.
      - mempalace-wiki-mine.py (hook, ~/.claude/hooks/) — module-load guarded import (`except BaseException` catches argparse SystemExit + KnowledgeGraph SQLite errors), dup-check call between fingerprint-idempotency check and mine_wiki() at the calibrated 0.85 threshold. End-to-end verified.
      - knowledgeforge-core-rk4 closed (P2 → CLOSED).
  - version: 7.3.0
    date: 2026-05-24
    driver: knowledgeforge-core-8xq
    note: |
      Module 22 Phase 1 reconciliation with MemPalace adoption (post adversarial review).

      Original v6.5.0 spec assumed direct ChromaDB integration; reality is that MemPalace
      (already installed + connected as MCP, wraps ChromaDB internally) provides the vector
      store. Strategist analysis selected a Phased A→D approach: Phase 1 = minimum-viable
      MemPalace wrapping, Phase 2 = layered fusion + frontmatter filter when triggered.

      Initial Builder draft included orchestrator-context retrieval via kf-route.py and
      wing/room pre-filter scoping. Adversarial-critic review found 5 sev-2+ flaws:
      (1) check-duplicate CLI subcommand doesn't exist; (2) wing derivation in
      mempalace-wiki-mine.py collapses subdomains into repo-level wing; (3) M21/M23
      cross-references contradicted Phase 1 scope; (4) "zero duplicates filed" criterion
      structurally unachievable in PostToolUse; (5) wing inference + additionalContext
      contract in kf-route.py was vague and didn't match actual hook output schema.

      Scope reduced post-critic: Phase 1 is now JUST the dup-check gate (via direct Python
      import from mempalace.mcp_server, bypassing both CLI and MCP runtime). Wing/room
      scoping, score fusion, and orchestrator-context retrieval moved to Phase 2
      (knowledgeforge-core-acu), with the wing-derivation defect listed as a Phase 2
      prerequisite. M21 and M23 cross-references updated.
    changes:
      - Module 22 (7.3.0) — full rewrite + post-critic scope reduction. Phase 1 = dup-check only (wing-less, direct Python import). Phase 2 (Deferred) preserves the v6.5.0 design intent for fusion + frontmatter filter + wing scoping. Anti-patterns updated with explicit "CLI subcommand doesn't exist" and "wing-scoping check_duplicate is a no-op" rules. 4 Phase 2 Upgrade Triggers documented. Phase 2 prerequisites listed (including wing-derivation fix in mempalace-wiki-mine.py).
      - Module 21 (7.0.6) — step_4b_embedding rewritten: embedding happens inside MemPalace's mine pipeline, not via direct ChromaDB. Metadata preservation acknowledged as Phase 2 readiness, not Phase 1 retrieval input. rebuild_trigger clarified — index maintained automatically by mempalace-wiki-mine PostToolUse hook.
      - Module 23 (6.5.2) — Module 22 cross-reference updated: Phase 1 of M22 does not consume Module 23 vocabulary at retrieval time; write-time enforcement remains mandatory as a Phase 2 prerequisite.
      - Module 00 (7.3.0) — Module Reference rows for Semantic Wiki Search (22) and Entity Relationship Analysis (25) qualified to Phase 1 reality; title and version bumped to track system version. Caught by second critic pass — dragnet for stale Phase-2-as-current cross-references.
      - Module 25 (7.0.3) — Memory Retrieval Enhancement section qualified: entity-scoped metadata filter integration with M22 is Phase 2; Phase 1 silently drops the filter args. M24 integration unchanged.
      - Module 21 (7.0.6) addendum — CC Doc Gate 4b rewritten: was "blocking embedding gate (pre-write)", now correctly "detect-and-warn dup-check (post-write PostToolUse)". Caught by second critic pass.
      - "Module 22 (7.3.0) addendum — import safety qualifier added: `from mempalace.mcp_server import ...` instantiates `KnowledgeGraph()` at module-load time, so the import depends on palace initialization. Spec now mandates try/except around the import. Caught by second critic pass."
      - Module 06 (7.3.0) — Quick Reference: FOUR locations updated for M22/M25 Phase 1 reality. Initial pass missed three (Module Reference Table M22 + M25 rows; Integration Graph M25 entry; Infrastructure Modules M25 row). Third critic pass caught these.
      - Module 22 (7.3.0) addendum 2 — import guard upgraded from `except Exception` to `except BaseException`. argparse's `parse_known_args()` runs at mcp_server.py module-load and can raise `SystemExit` (which inherits from BaseException, not Exception). Caught by third critic pass.
      - Module 23 (6.5.2) addendum + Module 24 (6.5.1) — reverse-direction references updated: M23 Integration Points → Module 24 subsection, M23 Related Modules bullet, and M24 entry-schema subsection all qualified cross-tier filtering as Phase 2 Deferred. Caught by fourth critic pass.
      - Module 00 (7.3.0) addendum — orchestrator Phase-2 routing paragraph (the post-routing ERA pass) qualified: Tier 0 entity-scoped filter integration is Phase 2 Deferred; Tier 3 (M24) remains active. Caught by fourth critic pass self-dragnet.
      - Module 22 (7.3.0) addendum 3 — Implementation Status section added making explicit that 8xq landed the SPEC, not the hook code. Phase 1 Success Criteria reframed as target state pending knowledgeforge-core-rk4 (hook implementation bead, P2, depends on 8xq). Caught by fifth critic pass — spec-to-implementation gap was a category prior passes missed by reviewing only spec artifacts.
      - Module 22 (7.3.0) addendum 4 — pending-state qualifiers propagated to Integration Points and CC Doc sections; CC Doc insertion-point language reconciled (BETWEEN fingerprint check and mine_wiki, matching Implementation section); Phase 1 Success Criteria measurement expanded with three rows verifying insertion point, BaseException guard pattern, and bead-state. Caught by sixth critic pass — residual Implementation Status disclaimer scope.
      - Phase 2 trigger bead filed as knowledgeforge-core-acu (P4, deferred-triggered).
