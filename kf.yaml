name: KnowledgeForge
version: 7.0.1
description: >
  Multi-platform, multi-model reasoning framework.
  Single source of truth for all KF variants.

status: active
phase: 6  # Compiler MVP

variants:
  knowledgeforge-cp:
    role: Claude Projects variant
    status: compiled
    repo: git@github.com:internexio/knowledgeforge-cp.git
    note: Compiled from core via kf-compile --target claude-projects
  knowledgeforge-cc:
    role: Claude Code variant
    status: compiled
    repo: git@github.com:internexio/knowledgeforge-cc.git
    note: Compiled from core via kf-compile --target claude-code
  knowledgeforge-cw:
    role: Cowork variant
    status: drifting
    repo: git@github.com:internexio/knowledgeforge-cw.git
  knowledgeforge-web:
    role: Web agents variant
    status: future
    note: Does not exist yet — Phase 8

modules:
  count: 26
  range: "00–25"
  source: knowledgeforge-cp (as of 2026-04-14)

changelog:
  - version: 7.0.1
    date: 2026-04-16
    changes:
      - Module 25 (ERA) now compiles to CC — added CC Doc section, CC platform binding entry, M25 in kf_module_index.txt
      - Module 25 version bumped to 6.6.0
  - version: 7.0.0
    date: 2026-04-14
    changes:
      - Phase 1 complete — UserPromptSubmit hook with Gemini Flash Lite
      - Phase 2 complete — skill files, cross-cutting docs, slash commands in knowledgeforge-cc
      - Phase 3 complete — Stop gate, PreCompact/PostCompact, PostToolUse, SessionStart hooks
      - Phase 4 complete — 15 module spec updates (items 1-13 from research + ENH-006/007)
      - Phase 5 complete — 5 model profiles (Sonnet, Opus, GPT-5, OLMo, Gemini Flash Lite)
      - Phase 6 complete — compiler MVP; CC and CP variants now compiled from core
  - version: 7.0.0-alpha
    date: 2026-04-14
    changes:
      - Established knowledgeforge-core as single source of truth
      - Copied all 26 canonical modules from knowledgeforge-cp
      - Organized plan documents from architecture sessions
      - Created CLAUDE.md with Calibrator configuration
      - Initial directory structure established
  - version: 6.6.1
    date: 2026-04-13
    changes:
      - KF 6.x final state — CP as source of truth
      - 25 modules (00–24) plus ERA (25)
      - Architecture sessions produced 9 integration plans
