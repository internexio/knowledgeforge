name: Sync hooks → knowledgeforge-cc

# Fires when hook scripts change on main.
# Opens a PR in knowledgeforge-cc with the updated hook files.
# Requires: CORE_SYNC_TOKEN secret — GitHub PAT with repo write access to knowledgeforge-cc.

on:
  push:
    branches: [main]
    paths:
      - 'hooks/**'
  workflow_dispatch:  # Allow manual trigger for catch-up syncs

jobs:
  sync-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for git diff to list changed files

      - name: Checkout knowledgeforge-cc
        uses: actions/checkout@v4
        with:
          repository: internexio/knowledgeforge-cc
          token: ${{ secrets.CORE_SYNC_TOKEN }}
          path: cc-repo

      - name: Sync hook files to CC
        run: |
          mkdir -p cc-repo/.claude/hooks/
          cp hooks/kf-route.py              cc-repo/.claude/hooks/
          cp hooks/kf_module_index.txt      cc-repo/.claude/hooks/
          cp hooks/kf-stop-validator.py     cc-repo/.claude/hooks/
          cp hooks/kf-precompact.py         cc-repo/.claude/hooks/
          cp hooks/kf-postcompact.py        cc-repo/.claude/hooks/
          cp hooks/kf-edit-nudge.py         cc-repo/.claude/hooks/
          cp hooks/kf-session-start.py      cc-repo/.claude/hooks/

      - name: Detect changes
        id: changes
        working-directory: cc-repo
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hook changes to sync."
          fi

      - name: Create PR in knowledgeforge-cc
        if: steps.changes.outputs.changed == 'true'
        working-directory: cc-repo
        env:
          GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
        run: |
          git config user.name "kf-sync[bot]"
          git config user.email "kf-sync[bot]@users.noreply.github.com"

          CORE_SHA="${{ github.sha }}"
          CORE_SHA_SHORT="${CORE_SHA:0:7}"
          BRANCH="sync/hooks-${CORE_SHA_SHORT}"

          # List what changed in core (best-effort; falls back gracefully)
          CHANGED=$(git -C .. diff --name-only HEAD~1 HEAD -- hooks/ 2>/dev/null \
            | sed 's/^/- /' || echo "- (diff unavailable)")

          git checkout -b "$BRANCH"
          git add .claude/hooks/
          git commit -m "chore(hooks): sync from knowledgeforge-core@${CORE_SHA_SHORT}"
          git push origin "$BRANCH"

          gh pr create \
            --repo internexio/knowledgeforge-cc \
            --title "chore(hooks): sync hook updates from core@${CORE_SHA_SHORT}" \
            --body "## Automated hook sync from knowledgeforge-core

**Source commit:** [\`${CORE_SHA_SHORT}\`](https://github.com/internexio/knowledgeforge-core/commit/${CORE_SHA})

### Changed in core
${CHANGED}

### What this updates
Files copied to \`.claude/hooks/\` in this repo. These are the source copies — the actual deploy target is \`~/.claude/hooks/\` on each machine. After merging, run:
\`\`\`
./scripts/deploy-hooks.sh
\`\`\`

---
*Generated by [sync-hooks-cc.yml](https://github.com/internexio/knowledgeforge-core/blob/main/.github/workflows/sync-hooks-cc.yml)*" \
            --base main \
            --head "$BRANCH"
