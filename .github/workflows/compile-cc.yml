name: Compile modules → knowledgeforge-cc

# Fires when module specs change on main.
# Runs kf-compile --target claude-code and opens a PR in knowledgeforge-cc.
# Updates skill files, doc files, and agent files — not hooks (handled by sync-hooks-cc.yml).
# Requires: CORE_SYNC_TOKEN secret — GitHub PAT with repo write access to knowledgeforge-cc.

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
  workflow_dispatch:  # Allow manual trigger for catch-up syncs

jobs:
  compile-cc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout knowledgeforge-cc
        uses: actions/checkout@v4
        with:
          repository: internexio/knowledgeforge-cc
          token: ${{ secrets.CORE_SYNC_TOKEN }}
          path: cc-repo

      - name: Install compiler dependencies
        run: pip install pyyaml --quiet

      - name: Compile CC variant
        run: |
          python3 compiler/kf-compile.py \
            --target claude-code \
            --output cc-repo

      - name: Detect changes
        id: changes
        working-directory: cc-repo
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes after compilation."
          fi

      - name: Create PR in knowledgeforge-cc
        if: steps.changes.outputs.changed == 'true'
        working-directory: cc-repo
        env:
          GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
        run: |
          git config user.name "kf-sync[bot]"
          git config user.email "kf-sync[bot]@users.noreply.github.com"

          CORE_SHA="${{ github.sha }}"
          CORE_SHA_SHORT="${CORE_SHA:0:7}"
          BRANCH="compile/cc-${CORE_SHA_SHORT}"

          CHANGED_MODULES=$(git -C .. diff --name-only HEAD~1 HEAD -- modules/ 2>/dev/null \
            | sed 's/^/- /' || echo "- (diff unavailable)")

          CHANGED_CC=$(git status --porcelain | grep -v '.kf-compile-manifest' | awk '{print "- " $2}')

          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore(compile): CC build from core@${CORE_SHA_SHORT}"
          git push origin "$BRANCH"

          gh pr create \
            --repo internexio/knowledgeforge-cc \
            --title "chore(compile): CC build from core@${CORE_SHA_SHORT}" \
            --body "## Compiled from knowledgeforge-core

**Source commit:** [\`${CORE_SHA_SHORT}\`](https://github.com/internexio/knowledgeforge-core/commit/${CORE_SHA})

### Core modules changed
${CHANGED_MODULES}

### CC files updated
${CHANGED_CC}

### How this was built
\`kf-compile --target claude-code\` — extracts ## CC Skill / ## CC Doc / ## CC Agent sections from each module and writes the compiled output to \`.claude/skills/\`, \`.claude/docs/\`, and \`.claude/agents/\`.

### After merging
No action needed for skill/doc/agent files — they're loaded by Claude Code automatically.
If hooks also changed in this push, a separate PR from \`sync-hooks-cc.yml\` handles those.

---
*Generated by [compile-cc.yml](https://github.com/internexio/knowledgeforge-core/blob/main/.github/workflows/compile-cc.yml)*" \
            --base main \
            --head "$BRANCH"
