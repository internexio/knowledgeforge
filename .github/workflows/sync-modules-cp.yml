name: Compile modules -> knowledgeforge-cp

# Fires when module specs change on main.
# Runs kf-compile --target claude-projects and opens a PR in knowledgeforge-cp.
# Requires: CORE_SYNC_TOKEN secret -- GitHub PAT with repo write access to knowledgeforge-cp.

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
  workflow_dispatch:

jobs:
  compile-cp:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout knowledgeforge-cp
        uses: actions/checkout@v4
        with:
          repository: internexio/knowledgeforge-cp
          token: ${{ secrets.CORE_SYNC_TOKEN }}
          path: cp-repo

      - name: Install compiler dependencies
        run: pip install pyyaml --quiet

      - name: Compile CP variant
        run: |
          python3 compiler/kf-compile.py \
            --target claude-projects \
            --output cp-repo

      - name: Detect changes
        id: changes
        working-directory: cp-repo
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes after compilation."
          fi

      - name: Create PR in knowledgeforge-cp
        if: steps.changes.outputs.changed == 'true'
        working-directory: cp-repo
        env:
          GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
        run: |
          git config user.name "kf-sync[bot]"
          git config user.email "kf-sync[bot]@users.noreply.github.com"

          CORE_SHA="${{ github.sha }}"
          CORE_SHA_SHORT="${CORE_SHA:0:7}"
          BRANCH="compile/cp-${CORE_SHA_SHORT}"

          # Skip if a PR already exists for this SHA (idempotent re-runs)
          EXISTING_PR=$(gh pr list \
            --repo internexio/knowledgeforge-cp \
            --head "$BRANCH" \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for core@${CORE_SHA_SHORT} — skipping."
            exit 0
          fi

          # Delete remote branch if it exists but has no open PR (e.g. from a merged run)
          git push origin --delete "$BRANCH" 2>/dev/null || true

          CHANGED_MODULES=$(git -C .. diff --name-only HEAD~1 HEAD -- modules/ 2>/dev/null \
            | sed 's/^/- /' || echo "- (diff unavailable)")

          CHANGED_CP=$(git status --porcelain | grep -v '.kf-compile-manifest' | awk '{print "- " $2}')

          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore(compile): CP build from core@${CORE_SHA_SHORT}"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md << EOF
          ## Compiled from knowledgeforge-core

          Source commit: ${CORE_SHA_SHORT} (https://github.com/internexio/knowledgeforge-core/commit/${CORE_SHA})

          ### Core modules changed
          ${CHANGED_MODULES}

          ### CP files updated
          ${CHANGED_CP}

          ### How this was built
          kf-compile --target claude-projects -- CC compilation sections stripped;
          CP receives clean module content with CP filename mapping applied.
          EOF

          gh pr create \
            --repo internexio/knowledgeforge-cp \
            --title "chore(compile): CP build from core@${CORE_SHA_SHORT}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
