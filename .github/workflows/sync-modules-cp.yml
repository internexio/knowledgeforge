name: Sync modules → knowledgeforge-cp

# Fires when module specs change on main.
# Opens a PR in knowledgeforge-cp with updated module files, matched by two-digit prefix.
# Requires: CORE_SYNC_TOKEN secret — GitHub PAT with repo write access to knowledgeforge-cp.

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
  workflow_dispatch:  # Allow manual trigger for catch-up syncs

jobs:
  sync-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for git diff to list changed files

      - name: Checkout knowledgeforge-cp
        uses: actions/checkout@v4
        with:
          repository: internexio/knowledgeforge-cp
          token: ${{ secrets.CORE_SYNC_TOKEN }}
          path: cp-repo

      - name: Sync module files to CP
        run: |
          python3 scripts/sync-cp-modules.py \
            --core modules/ \
            --cp cp-repo/

      - name: Detect changes
        id: changes
        working-directory: cp-repo
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No module changes to sync."
          fi

      - name: Create PR in knowledgeforge-cp
        if: steps.changes.outputs.changed == 'true'
        working-directory: cp-repo
        env:
          GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
        run: |
          git config user.name "kf-sync[bot]"
          git config user.email "kf-sync[bot]@users.noreply.github.com"

          CORE_SHA="${{ github.sha }}"
          CORE_SHA_SHORT="${CORE_SHA:0:7}"
          BRANCH="sync/modules-${CORE_SHA_SHORT}"

          # Which core modules changed in this push
          CHANGED_CORE=$(git -C .. diff --name-only HEAD~1 HEAD -- modules/ 2>/dev/null \
            | sed 's/^/- /' || echo "- (diff unavailable)")

          # Which CP files will be updated
          CHANGED_CP=$(git status --porcelain | awk '{print "- " $2}')

          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore(modules): sync from knowledgeforge-core@${CORE_SHA_SHORT}"
          git push origin "$BRANCH"

          gh pr create \
            --repo internexio/knowledgeforge-cp \
            --title "chore(modules): sync module updates from core@${CORE_SHA_SHORT}" \
            --body "## Automated module sync from knowledgeforge-core

**Source commit:** [\`${CORE_SHA_SHORT}\`](https://github.com/internexio/knowledgeforge-core/commit/${CORE_SHA})

### Core modules changed
${CHANGED_CORE}

### CP files updated
${CHANGED_CP}

### Sync method
Files are matched by two-digit prefix number (e.g. \`09_debugger_agent.md\` → \`09_Debugger_Agent.md\`). Core content replaces CP content verbatim. CP filenames are preserved.

> **Note:** Until Phase 6 (compiler), this is a direct content copy. Post-compiler, this workflow will invoke \`kf-compile --target claude-projects\` instead.

---
*Generated by [sync-modules-cp.yml](https://github.com/internexio/knowledgeforge-core/blob/main/.github/workflows/sync-modules-cp.yml)*" \
            --base main \
            --head "$BRANCH"
